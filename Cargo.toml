[workspace]
resolver = "2"
members = ["crates/onelang-core", "crates/onelang-platform", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Nikolay Slivinskiy"]

[workspace.dependencies]
onelang-core = { path = "crates/onelang-core" }
onelang-platform = { path = "crates/onelang-platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
log = "0.4"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
